spring:
  application:
    name: medview
  datasource:
    url: jdbc:h2:file:./data/medview-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

medview:
  security:
    jwt:
      # Override with the JWT_SECRET environment variable outside development (at least 32 characters).
      secret: ${JWT_SECRET:medview-dev-secret-change-me-in-production-0123456789}
      expiration-minutes: 60
